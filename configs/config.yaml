# Sumber input: image_folder | video_file | rtsp
source:
  type: image_folder
  path: data/samples
  frame_stride: 1        # khusus video/rtsp: ambil tiap N frame

model:
  weights: models/pretrained/yolo11n.pt   # diunduh otomatis oleh Ultralytics jika belum ada
  conf: 0.35
  imgsz: 640
  device: null           # null = otomatis, atau "cpu" / "0"
  classes: [person, car, motorcycle, bus, truck]

events:
  min_confidence: 0.5 

preprocess:
  max_side: 1280         # perkecil jika sisi terpanjang melebihi nilai ini (null = nonaktif)

tracking:
  enabled: false         # aktifkan hanya untuk video / sequence frame
  tracker: bytetrack.yaml

zones:
  file: configs/zones.yaml
  anchor: bottom_center  # bottom_center | center

output:
  dir: data/outputs
  save_annotated: true